<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Señal de Gol ⚽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<style>
/* ════════════════════════════════════════════════════
   TEMA: Claro con gradientes verdes (estadio)
   Alto contraste, fondo claro, texto oscuro nítido
════════════════════════════════════════════════════ */
:root{
  --bg:#0a3d1a;
  --sf:#ffffff;
  --sf2:#f5f8f5;
  --sf3:#eaf0ea;
  --bd:#c8d8c0;
  --ac:#1a7a3c;
  --ac2:#e8a000;
  --dg:#c0392b;
  --tx:#1a2510;
  --tx2:#3a5028;
  --tx3:#4d6238;
  --lo:#1a5c9a;
  --vi:#b84a00;
  --gold:#e8a000;--silver:#607060;--bronze:#a0522d;--vip:#6a1a9a;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{overflow-x:hidden;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;line-height:1.5;}

/* Fondo estadio — gradiente verde cancha */
body::before{
  content:'';
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(20,80,30,.06) 0%,rgba(240,244,240,0) 40%),
    /* líneas de cancha */
    repeating-linear-gradient(90deg,transparent,transparent 79px,rgba(26,122,60,.06) 79px,rgba(26,122,60,.06) 80px),
    repeating-linear-gradient(0deg,transparent,transparent 79px,rgba(26,122,60,.06) 79px,rgba(26,122,60,.06) 80px);
}
/* Círculo central cancha */
body::after{
  content:'';
  position:fixed;
  width:380px;height:380px;
  border:5px solid rgba(255,255,255,.16);
  border-radius:50%;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  pointer-events:none;z-index:0;
}
#root{position:relative;z-index:1;}

/* ── LANDING ── */
.landing{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:clip;padding:24px;
}
body.landing-bg{
  background:url('https://res.cloudinary.com/cdupojuy/image/upload/v1783281811/IMG_9377_skobdk.png') center center/cover no-repeat;
}
body.landing-bg::before,body.landing-bg::after{display:none;}
.land-lines{
  position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(90deg,transparent,transparent 79px,rgba(255,255,255,.04) 79px,rgba(255,255,255,.04) 80px),
    repeating-linear-gradient(0deg,transparent,transparent 79px,rgba(255,255,255,.04) 79px,rgba(255,255,255,.04) 80px);
}
.land-circle{position:absolute;border:2px solid rgba(255,255,255,.06);border-radius:50%;pointer-events:none;}
.land-c1{width:500px;height:500px;left:50%;top:50%;transform:translate(-50%,-50%);}
.land-c2{width:200px;height:200px;left:50%;top:50%;transform:translate(-50%,-50%);}
.land-arc{position:absolute;bottom:-60px;left:50%;width:400px;height:120px;border:2px solid rgba(255,255,255,.06);border-radius:50% 50% 0 0/100% 100% 0 0;transform:translateX(-50%);pointer-events:none;}
.land-inner{position:relative;z-index:1;text-align:center;max-width:580px;}
.land-ball{width:60px;height:60px;object-fit:contain;margin:0 auto 14px;display:block;animation:bob 2.5s ease-in-out infinite;filter:drop-shadow(0 4px 20px rgba(255,255,255,.3));}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.land-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(60px,13vw,110px);line-height:.9;letter-spacing:5px;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.4);margin-bottom:8px;}
.land-slogan{font-family:'Barlow Condensed',sans-serif;font-size:clamp(13px,3vw,18px);letter-spacing:8px;color:rgba(255,255,255,.6);text-transform:uppercase;margin-bottom:44px;}
.land-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:52px;}
.btn-lp{background:#fff;border:none;border-radius:12px;padding:15px 40px;color:#0a3d1a;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .22s;box-shadow:0 4px 24px rgba(0,0,0,.3);}
.btn-lp:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.4);}
.btn-ls{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:15px 40px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:600;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:all .22s;backdrop-filter:blur(8px);}
.btn-ls:hover{background:rgba(255,255,255,.22);}
.land-crowd{position:absolute;bottom:0;left:0;width:100%;z-index:0;pointer-events:none;overflow:hidden;}
.land-crowd img{width:100%;display:block;object-fit:cover;object-position:top center;}

/* ── AUTH ── */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(145deg,#0a3d1a,#1a5a2a);}
.auth-card{background:#fff;border:1px solid var(--bd);border-radius:20px;padding:36px 30px;width:400px;max-width:100%;box-shadow:0 8px 40px rgba(0,0,0,.2);}
.auth-logo{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:3px;color:var(--ac);}
.auth-sub{font-size:12px;letter-spacing:3px;color:var(--tx3);text-transform:uppercase;margin-bottom:20px;font-weight:600;}
.auth-tabs{display:flex;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:3px;margin-bottom:18px;}
.auth-tab{flex:1;padding:9px;border-radius:6px;border:none;background:none;color:var(--tx3);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.auth-tab.on{background:var(--ac);color:#fff;}
.flbl{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin-bottom:5px;text-align:left;font-weight:700;}
.fi{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:12px 14px;color:var(--tx);font-family:'Barlow',sans-serif;font-size:14px;outline:none;transition:border-color .2s;margin-bottom:11px;font-weight:500;}
.fi:focus{border-color:var(--ac);}
.fi::placeholder{color:var(--tx3);}
.bp{width:100%;background:var(--ac);border:none;border-radius:9px;padding:13px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.bp:disabled{opacity:.4;cursor:not-allowed;}
.bp:hover:not(:disabled){background:#155c2e;}
.txt-lnk{margin-top:10px;font-size:12px;color:var(--tx3);cursor:pointer;display:block;text-align:center;transition:color .2s;font-weight:500;}
.txt-lnk:hover{color:var(--ac);}
.vip-lnk{margin-top:8px;font-size:12px;color:var(--tx3);cursor:pointer;display:block;text-align:center;font-weight:500;}
.vip-lnk:hover{color:var(--vip);}
.err-box{background:#fef2f2;border:1px solid #fca5a5;border-radius:8px;padding:8px 12px;font-size:12px;color:#dc2626;margin-bottom:10px;font-weight:500;}
.ok-box{background:#f0fdf4;border:1px solid #86efac;border-radius:8px;padding:8px 12px;font-size:12px;color:#16a34a;margin-bottom:10px;font-weight:500;}

/* ── MODAL ── */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:900;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);padding:14px;}
.mdl{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px;width:440px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 16px 60px rgba(0,0,0,.2);}
.mdl.vip-mdl{border-color:rgba(106,26,154,.3);}
.mdl h3{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;margin-bottom:14px;color:var(--tx);}
.mlbl{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);margin-bottom:4px;font-weight:700;}
.mi{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:10px 13px;color:var(--tx);font-family:'Barlow',sans-serif;font-size:13px;outline:none;margin-bottom:11px;font-weight:500;}
.mi:focus{border-color:var(--ac);}
.mi::placeholder{color:var(--tx3);}
.mse{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:10px 13px;color:var(--tx);font-family:'Barlow',sans-serif;font-size:13px;outline:none;margin-bottom:11px;cursor:pointer;}
.mta{width:100%;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:10px 13px;color:var(--tx);font-family:'Barlow',sans-serif;font-size:13px;outline:none;margin-bottom:11px;resize:vertical;min-height:100px;}
.mta:focus{border-color:var(--ac);}
.mda{display:flex;gap:8px;margin-top:6px;}
.btn-c{flex:1;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:10px;color:var(--tx3);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.btn-c:hover{border-color:var(--dg);color:var(--dg);}
.btn-v{flex:2;background:var(--vip);border:none;border-radius:8px;padding:10px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.btn-v:disabled{opacity:.4;cursor:not-allowed;}
.btn-g{flex:2;background:var(--ac);border:none;border-radius:8px;padding:10px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.btn-r{flex:2;background:var(--dg);border:none;border-radius:8px;padding:10px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;}
.mdl-err{background:#fef2f2;border:1px solid #fca5a5;border-radius:6px;padding:8px 12px;font-size:12px;color:#dc2626;margin-bottom:10px;}
.mdl-ok{background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:8px 12px;font-size:12px;color:#16a34a;margin-bottom:10px;}

/* ── HEADER ── */
header{background:#fff;border-bottom:2px solid var(--bd);padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.08);}
.logo-hdr{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--ac);letter-spacing:2px;cursor:pointer;}
.hdr-r{display:flex;align-items:center;gap:8px;}
.u-pill{display:flex;align-items:center;gap:7px;background:var(--sf2);border:1px solid var(--bd);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--tx2);cursor:pointer;max-width:160px;transition:all .2s;font-weight:600;}
.u-pill:hover{border-color:var(--ac);color:var(--ac);}
.u-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.u-dot{width:7px;height:7px;border-radius:50%;background:var(--ac);flex-shrink:0;}
.u-dot.vip{background:var(--vip);}
.vip-bdg{background:var(--vip);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:700;color:#fff;letter-spacing:1px;white-space:nowrap;}
.btn-out{background:#fef2f2;border:1px solid #fca5a5;border-radius:7px;padding:6px 12px;color:#dc2626;font-size:12px;cursor:pointer;font-weight:700;}
.btn-out:hover{background:#fee2e2;}

/* ── MOBILE NAV ── */
.mobile-nav{display:none;background:#fff;border-bottom:2px solid var(--bd);padding:0 10px;}
.mn-inner{display:flex;gap:3px;padding:7px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.mn-inner::-webkit-scrollbar{display:none;}
.mn-btn{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:7px 11px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--tx2);cursor:pointer;white-space:nowrap;transition:all .15s;flex-shrink:0;}
.mn-btn.on{background:var(--ac);border-color:var(--ac);color:#fff;}
.mn-btn.von.on{background:var(--vip);border-color:var(--vip);color:#fff;}
.mn-sep{width:1px;background:var(--bd);margin:3px 5px;flex-shrink:0;}

/* ── LAYOUT ── */
.app-body{display:flex;min-height:calc(100vh - 54px);}
.sidebar{width:202px;background:#fff;border-right:2px solid var(--bd);padding:10px 0;flex-shrink:0;overflow-y:auto;box-shadow:2px 0 8px rgba(0,0,0,.04);}
.main-content{flex:1;padding:22px 18px;overflow-x:hidden;min-width:0;}
.sblbl{font-size:11px;letter-spacing:2px;color:var(--tx3);text-transform:uppercase;font-weight:700;padding:8px 14px 4px;}
.sblbl.vip-l{color:var(--vip);}
.sbit{display:flex;align-items:center;gap:8px;padding:8px 11px;cursor:pointer;font-size:12px;color:var(--tx2);transition:all .15s;border:1px solid transparent;margin:1px 7px;border-radius:9px;font-weight:600;}
.sbit:hover{background:var(--sf2);color:var(--tx);border-color:var(--bd);}
.sbit.on{background:rgba(26,122,60,.1);border-color:rgba(26,122,60,.3);color:var(--ac);}
.sbit.von.on{background:rgba(106,26,154,.08);border-color:rgba(106,26,154,.25);color:var(--vip);}
.sbdiv{border:none;border-top:1px solid var(--bd);margin:6px 11px;}
.sbic{width:16px;text-align:center;font-size:13px;flex-shrink:0;}

/* ── PAGE ── */
.pg{animation:fi .2s ease;}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.stitle{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:3px;margin-bottom:3px;color:#fff;}
.ssub{font-size:12px;color:#bcdcb0;margin-bottom:16px;font-weight:600;}

/* ── FILTER TABS ── */
.filter-label{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#bcdcb0;margin-bottom:7px;font-weight:700;}
.filter-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;}
.ftab{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:5px 12px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--tx2);cursor:pointer;transition:all .15s;}
.ftab:hover{border-color:var(--ac);color:var(--ac);}
.ftab.on{background:var(--ac);border-color:var(--ac);color:#fff;}

/* ── GRUPO ACTIVO BAR (global) ── */
.grupo-activo-bar{background:linear-gradient(90deg,#0f2e1a,#1a7a3c);padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.gab-lbl{color:#fff;font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;opacity:.9;flex-shrink:0;}
.gab-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.gab-tab{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 14px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:#fff;cursor:pointer;transition:all .15s;}
.gab-tab:hover{background:rgba(255,255,255,.22);}
.gab-tab.on{background:#fff;border-color:#fff;color:#1a7a3c;}
@media(max-width:680px){.grupo-activo-bar{padding:8px 12px;}.gab-lbl{width:100%;}}

/* ── FECHA TABS ── */
.fn{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:12px;}
.ft{background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:6px 11px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:var(--tx2);cursor:pointer;transition:all .15s;}
.ft:hover{border-color:var(--ac);color:var(--ac);}
.ft.on{background:var(--ac);border-color:var(--ac);color:#fff;}

/* ── LEGEND ── */
.legend{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.lgit{display:flex;align-items:center;gap:5px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--tx2);font-weight:600;}
.lgdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ── AUTO LIMIT ── */
.albar{display:flex;align-items:center;gap:9px;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;padding:9px 14px;margin-bottom:11px;font-size:12px;color:var(--tx2);flex-wrap:wrap;font-weight:600;}
.alpips{display:flex;gap:5px;}
.alpip{width:13px;height:13px;border-radius:50%;border:2px solid var(--bd);}
.alpip.used{background:var(--ac2);border-color:var(--ac2);}
.alpip.ban{background:var(--dg);border-color:var(--dg);}

/* ── COUNTDOWN ── */
.cd{border-radius:11px;padding:11px 15px;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.cd.open{background:#f0fdf4;border:1px solid #86efac;}
.cd.warn{background:#fffbeb;border:1px solid #fcd34d;}
.cd.closed{background:#fef2f2;border:1px solid #fca5a5;}
.cd.none{background:var(--sf2);border:1px solid var(--bd);}
.cdt{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--tx);}
.cds{font-size:12px;color:var(--tx3);margin-top:1px;font-weight:600;}
.cdclock{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;color:var(--ac);margin-left:auto;}
.cdclock.w{color:#d97706;}

/* ── PARTIDOS TABLE ── */
.ptbl{background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06);}
.ptblh{display:grid;padding:10px 16px;background:var(--sf2);border-bottom:1px solid var(--bd);}
.ptblh span{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);font-weight:700;text-align:center;}
.ptblh span:first-child{text-align:left;}
.prow{display:grid;padding:12px 16px;border-bottom:1px solid var(--sf3);align-items:center;transition:background .12s;}
.prow:last-child{border-bottom:none;}
.prow:hover{background:var(--sf2);}
.eqs{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;flex-wrap:wrap;}
.eql{color:var(--lo);}
.vs{color:var(--tx3);font-size:11px;font-weight:700;}
.eqv{color:var(--vi);}
.shield{width:26px;height:26px;object-fit:contain;flex-shrink:0;}
.shield-fallback{width:26px;height:26px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--tx2);flex-shrink:0;}
.cc{display:flex;align-items:center;justify-content:center;}
.si{width:38px;background:var(--sf2);border:1px solid var(--bd);border-radius:7px;padding:6px 2px;color:var(--tx);font-family:'Bebas Neue',sans-serif;font-size:18px;text-align:center;outline:none;-moz-appearance:textfield;transition:all .2s;}
.si::-webkit-outer-spin-button,.si::-webkit-inner-spin-button{-webkit-appearance:none;}
.si:focus{border-color:var(--ac);}
.si:disabled{opacity:.35;cursor:not-allowed;}
.sp{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--tx3);margin:0 4px;}
.ssaved{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;color:var(--ac);}
.sauto{font-size:13px;color:var(--tx3);font-weight:600;}
.sblank{font-size:12px;color:var(--dg);font-weight:700;}
.ri{width:38px;background:rgba(106,26,154,.06);border:1px solid rgba(106,26,154,.25);border-radius:7px;padding:6px 2px;color:var(--vip);font-family:'Bebas Neue',sans-serif;font-size:18px;text-align:center;outline:none;-moz-appearance:textfield;}
.ri::-webkit-outer-spin-button,.ri::-webkit-inner-spin-button{-webkit-appearance:none;}
.lkico{font-size:13px;margin-left:3px;color:var(--dg);}

/* ── BUTTONS ── */
.ab{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}

async function hashPass(p){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p+'prode_salt_2025'));return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');}
function calcPts(pred,partido){
  if(!pred||pred.es_blanco||partido.goles_local==null)return null;
  const rl=partido.goles_local,rv=partido.goles_visitante,pl=pred.goles_local,pv=pred.goles_visitante;
  const rW=rl>rv?'L':rv>rl?'V':'E',pW=pl>pv?'L':pv>pl?'V':'E';
  if(rW!==pW)return 0;
  if(pl===rl&&pv===rv)return((rl+rv)>=4)?4:2;
  return 1;
}
function fmtClock(ms){const h=Math.floor(ms/3600000),m=Math.floor((ms%3600000)/60000),s=Math.floor((ms%60000)/1000),p=n=>String(n).padStart(2,'0');return h>0?`${h}:${p(m)}:${p(s)}`:`${p(m)}:${p(s)}`;}
function ordinalPuesto(n){
  const medals={1:'🥇',2:'🥈',3:'🥉'};
  return medals[n]||`${n}°`;
}
function fmtDate(iso){if(!iso)return'';return new Date(iso).toLocaleString('es-AR',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});}
function fmtTime(iso){if(!iso)return'';return new Date(iso).toLocaleString('es-AR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});}
function dtLocal(iso){if(!iso)return'';const d=new Date(iso),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function pCls(pts){return pts===4?'p4':pts===2?'p2':pts===1?'p1':pts===0?'p0':'';}
function genCode(){return Math.random().toString(36).substring(2,8).toUpperCase();}
function renderMd(md){if(!md)return'';return md.replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/^[\d]+\. (.+)$/gm,'<li>$1</li>').replace(/^- (.+)$/gm,'<li>$1</li>').replace(/(<li>.*?<\/li>\n?)+/gs,s=>`<ul>${s}</ul>`).replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');}

// Escudo component con fallback a iniciales
function ShieldImg({nombre,size=26}){
  const url=shieldUrl(nombre);
  const [err,setErr]=useState(false);
  if(!url||err){
    const init=(nombre||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();
    return h('div',{className:'shield-fallback',style:{width:size,height:size,fontSize:size>22?11:9}},init);
  }
  return h('img',{src:url,className:'shield',style:{width:size,height:size},alt:nombre,onError:()=>setErr(true),loading:'lazy'});
}

function TorneoIcon({icono,size=16}){
  const [err,setErr]=useState(false);
  if(icono&&icono.startsWith('http')&&!err){
    return h('img',{src:icono,style:{width:size,height:size,objectFit:'contain',verticalAlign:'middle',flexShrink:0},onError:()=>setErr(true),loading:'lazy'});
  }
  return h('span',null,icono||'⚽');
}

async function apiFetch(key,season,round){
  const lg=LEAGUE_MAP[key];if(!lg)return{fixtures:null,msg:'Torneo manual.'};
  try{const res=await fetch(`https://api-football-v1.p.rapidapi.com/v3/fixtures?league=${lg.id}&season=${season}&round=${encodeURIComponent(round)}`,{headers:{'x-rapidapi-host':'api-football-v1.p.rapidapi.com','x-rapidapi-key':RAPID_KEY}});
  if(!res.ok)return{fixtures:null,msg:`Error API: ${res.status}`};
  const data=await res.json();if(!data.response?.length)return{fixtures:null,msg:'No se encontraron partidos.'};
  return{fixtures:data.response.map((f,i)=>({equipo_local:f.teams.home.name,equipo_visitante:f.teams.away.name,posicion:i,api_fixture_id:f.fixture.id,goles_local:f.goals.home,goles_visitante:f.goals.away,horario:f.fixture.date||null})),msg:null};
  }catch(e){return{fixtures:null,msg:`Error: ${e.message}`};}
}

  async function runAutoFill(){
    if(!user||!partidos.length||!fechaObj?.deadline)return;
    if(new Date()<new Date(fechaObj.deadline))return;
    // Reload latest preds fresh from DB to avoid race conditions
    const {data:freshPreds}=await db.from('pronosticos').select('partido_id').eq('usuario_id',user.id).in('partido_id',partidos.map(p=>p.id));
    const savedIds=new Set((freshPreds||[]).map(p=>p.partido_id));
    const missing=partidos.filter(p=>!savedIds.has(p.id));
    if(!missing.length)return; // All predictions already saved, nothing to do
    const {data:au}=await db.from('autos_usados').select('*').eq('usuario_id',user.id).eq('torneo_clave',curT.clave);
    const usedCount=au?.length||0;
    const canAuto=usedCount<AUTO_LIMIT;
    // Insert auto predictions
    await db.from('pronosticos').upsert(missing.map(p=>({usuario_id:user.id,partido_id:p.id,torneo_clave:curT.clave,goles_local:canAuto?rnd():0,goles_visitante:canAuto?rnd():0,es_auto:canAuto,es_blanco:!canAuto})),{onConflict:'usuario_id,partido_id'});
    if(canAuto)await db.from('autos_usados').upsert({usuario_id:user.id,torneo_clave:curT.clave,fecha_numero:curF},{onConflict:'usuario_id,torneo_clave,fecha_numero'});
    await loadMyPreds();await loadAutoCount();
  }

  async function loadStats(){
    let q=db.from('pronosticos').select(`goles_local,goles_visitante,es_blanco,usuario_id,torneo_clave,usuarios(nombre,nombre_real,equipo_favorito),partidos(goles_local,goles_visitante,fecha_id,fechas(numero))`);
    if(statsT)q=q.eq('torneo_clave',statsT);
    const {data}=await q;if(!data){setStatsData([]);return;}
    // group filter
    let allowedIds=null;
    if(activeGrupo){
      const ids=await getGroupUserIds(activeGrupo);
      allowedIds=ids;
    }
    const map={};
    data.forEach(pred=>{
      const u=pred.usuarios;if(!u)return;
      if(allowedIds&&!allowedIds.includes(pred.usuario_id))return;
      const dn=activeGrupo?(u.nombre_real||u.nombre):u.nombre;
      if(!map[dn])map[dn]={nombre:dn,equipo:u.equipo_favorito||'',pts:0,aP:0,aG:0,total:0};
      if(pred.es_blanco)return;
      const r=pred.partidos;if(!r||r.goles_local==null)return;
      if(statsF!==null&&pred.partidos?.fechas?.numero!==statsF)return;
      map[dn].total++;const pts=calcPts(pred,r);if(pts===null)return;
      map[dn].pts+=pts;
      const rW=r.goles_local>r.goles_visitante?'L':r.goles_visitante>r.goles_local?'V':'E';
      const pW=pred.goles_local>pred.goles_visitante?'L':pred.goles_visitante>pred.goles_local?'V':'E';
      if(rW===pW)map[dn].aP++;if(pred.goles_local===r.goles_local&&pred.goles_visitante===r.goles_visitante)map[dn].aG++;
    });
    setStatsData(Object.values(map).sort((a,b)=>b.pts-a.pts));
  }

  // Para usuarios que se registran después de que ya cerraron una o más fechas:
  // les completa esas fechas pasadas con aleatorios (respetando el límite de 3 por torneo),
  // igual que el auto-fill normal, para que no queden con casilleros vacíos sin poder cargar nada.
  async function catchUpMissedFechas(userId){
    try{
      const nowIso=new Date().toISOString();
      const {data:fechasCerradas}=await db.from('fechas').select('id,torneo_id,numero,deadline').lt('deadline',nowIso);
      if(!fechasCerradas||fechasCerradas.length===0)return;
      const {data:allTorneos}=await db.from('torneos').select('id,clave');
      const claveById={};(allTorneos||[]).forEach(t=>{claveById[t.id]=t.clave;});
      const fechaIds=fechasCerradas.map(f=>f.id);
      const {data:partidosCerrados}=await db.from('partidos').select('id,fecha_id').in('fecha_id',fechaIds);
      if(!partidosCerrados||partidosCerrados.length===0)return;
      const partidoIds=partidosCerrados.map(p=>p.id);
      const {data:existingPreds}=await db.from('pronosticos').select('partido_id').eq('usuario_id',userId).in('partido_id',partidoIds);
      const existingSet=new Set((existingPreds||[]).map(p=>p.partido_id));
      const {data:existingAutos}=await db.from('autos_usados').select('torneo_clave').eq('usuario_id',userId);
      const autoCountByTorneo={};(existingAutos||[]).forEach(a=>{autoCountByTorneo[a.torneo_clave]=(autoCountByTorneo[a.torneo_clave]||0)+1;});
      const fechaById={};fechasCerradas.forEach(f=>{fechaById[f.id]=f;});
      const missingByFecha={};
      partidosCerrados.forEach(p=>{
        if(!existingSet.has(p.id)){
          if(!missingByFecha[p.fecha_id])missingByFecha[p.fecha_id]=[];
          missingByFecha[p.fecha_id].push(p.id);
        }
      });
      const fechaIdsOrdenadas=Object.keys(missingByFecha).sort((a,b)=>new Date(fechaById[a].deadline)-new Date(fechaById[b].deadline));
      const predRows=[],autoRows=[];
      fechaIdsOrdenadas.forEach(fid=>{
        const f=fechaById[fid];
        const clave=claveById[f.torneo_id];
        if(!clave)return;
        const usedCount=autoCountByTorneo[clave]||0;
        const canAuto=usedCount<AUTO_LIMIT;
        missingByFecha[fid].forEach(pid=>{
          predRows.push({usuario_id:userId,partido_id:pid,torneo_clave:clave,goles_local:canAuto?rnd():0,goles_visitante:canAuto?rnd():0,es_auto:canAuto,es_blanco:!canAuto});
        });
        if(canAuto){
          autoRows.push({usuario_id:userId,torneo_clave:clave,fecha_numero:f.numero});
          autoCountByTorneo[clave]=usedCount+1;
        }
      });
      if(predRows.length>0)await db.from('pronosticos').upsert(predRows,{onConflict:'usuario_id,partido_id'});
      if(autoRows.length>0)await db.from('autos_usados').upsert(autoRows,{onConflict:'usuario_id,torneo_clave,fecha_numero'});
    }catch(e){ /* si falla, no bloqueamos el registro del usuario */ }
  }

  async function doRegister(){
    const nombre=aUser.trim();
    if(!nombre||nombre.length<2){setAErr('El usuario debe tener al menos 2 caracteres.');return;}
    if(!aNReal.trim()||aNReal.trim().split(' ').filter(Boolean).length<2){setAErr('Ingresá tu nombre Y apellido real (ej: Juan García).');return;}
    if(!aEmail.trim()||!aEmail.includes('@')){setAErr('Ingresá un email válido.');return;}
    if(!aPass||aPass.length<4){setAErr('La contraseña debe tener al menos 4 caracteres.');return;}
    if(aPass!==aPass2){setAErr('Las contraseñas no coinciden.');return;}
    setALoad(true);setAErr('');
    const norm=nombre.charAt(0).toUpperCase()+nombre.slice(1);
    const {data:exN}=await db.from('usuarios').select('id').eq('nombre',norm).single();
    if(exN){setAErr('Ese nombre de usuario ya existe. Elegí otro.');setALoad(false);return;}
    const {data:exE}=await db.from('usuarios').select('id').eq('email',aEmail.trim().toLowerCase()).single();
    if(exE){setAErr('Ese email ya está registrado.');setALoad(false);return;}
    const hash=await hashPass(aPass);
    const {data:newUser,error}=await db.from('usuarios').insert({nombre:norm,nombre_real:aNReal.trim(),email:aEmail.trim().toLowerCase(),password_hash:hash}).select().single();
    if(error){setAErr('Error: '+error.message);setALoad(false);return;}
    if(newUser?.id)await catchUpMissedFechas(newUser.id);
    setAOk('✅ Cuenta creada. Ahora podés iniciar sesión.');
    setAuthMode('login');setAPass('');setAPass2('');setANReal('');setAEmail('');setALoad(false);
  }

  async function deleteFecha(){
    if(!fechaObj){showT('⚠ No hay fecha seleccionada','warning');return;}
    if(!curT){showT('⚠ No hay torneo seleccionado','warning');return;}
    if(!window.confirm(`¿Eliminar ${curT?.label_fecha||'Fecha'} ${curF}? Esto borrará todos los partidos y pronósticos de esta fecha.`))return;
    // 1. Eliminar pronósticos de los partidos de esta fecha
    const partidoIds=partidos.map(p=>p.id);
    if(partidoIds.length>0){
      const {error:epron}=await db.from('pronosticos').delete().in('partido_id',partidoIds);
      if(epron){showT('❌ Error al eliminar pronósticos: '+epron.message,'error');return;}
    }
    // 2. Eliminar partidos de esta fecha
    const {error:ep}=await db.from('partidos').delete().eq('fecha_id',fechaObj.id);
    if(ep){showT('❌ Error al eliminar partidos: '+ep.message,'error');return;}
    // 3. Eliminar la fecha
    const {error:ef}=await db.from('fechas').delete().eq('id',fechaObj.id);
    if(ef){showT('❌ Error al eliminar fecha: '+ef.message,'error');return;}
    // 4. Reducir total_fechas del torneo
    const newTotal=Math.max(1,curT.total_fechas-1);
    const {error:et}=await db.from('torneos').update({total_fechas:newTotal}).eq('id',curT.id);
    if(et){showT('❌ Error al actualizar torneo: '+et.message,'error');return;}
    // 5. Actualizar estado local
    const newF=Math.max(1,curF-1);
    setCurT(prev=>({...prev,total_fechas:newTotal}));
    setTorneos(prev=>prev.map(t=>t.id===curT.id?{...t,total_fechas:newTotal}:t));
    setFechaObj(null);
    setPartidos([]);
    setRealInp({});
    setCurF(newF);
    showT(`✓ ${curT?.label_fecha||'Fecha'} ${curF} eliminada`,'success');
  }

  async function joinGrupo(){
    const nombre=grupoForm.joinNombre.trim().toLowerCase();
    const code=grupoForm.joinCodigo.trim().toUpperCase();
    if(!nombre){setGrupoErr('Ingresá el nombre del grupo.');return;}
    if(!code){setGrupoErr('Ingresá el código.');return;}
    const {data:matches}=await db.from('grupos').select('*').eq('codigo',code);
    const candidatosRaw=(matches||[]).filter(g=>g.nombre.toLowerCase()===nombre);
    if(candidatosRaw.length===0){setGrupoErr('No se encontró ningún grupo con ese nombre y código. Verificá ambos datos.');return;}
    if(candidatosRaw.length>1){
      // Mismo nombre + mismo código en más de un grupo: mostrar el usuario creador de cada uno para poder elegir el correcto
      const candidatos=await Promise.all(candidatosRaw.map(async g=>{
        let creatorName='(desconocido)';
        if(g.creador_id){
          const {data:cu}=await db.from('usuarios').select('nombre').eq('id',g.creador_id).single();
          if(cu)creatorName=cu.nombre;
        }
        return {...g,creatorName};
      }));
      setJoinCandidatos(candidatos);setGrupoErr('');return;
    }
    await joinGrupoConfirmado(candidatosRaw[0]);
  }

// ── Auto-actualización: detecta si hay una versión más nueva del sitio y se refresca sola ──
// (bypassea cualquier caché -de navegador, operadora, etc.- porque cada chequeo pide una URL única)
const APP_VERSION='2026070920';
(function(){
  async function checkForUpdate(isFirstCheck){
    try{
      const res=await fetch(window.location.pathname+'?_v='+Date.now(),{cache:'no-store'});
      const txt=await res.text();
      const m=txt.match(/APP_VERSION\s*=\s*'([^']+)'/);
      if(!m||m[1]===APP_VERSION)return;
      // Hay una versión nueva
      if(isFirstCheck&&!sessionStorage.getItem('sdg_reloaded_'+m[1])){
        sessionStorage.setItem('sdg_reloaded_'+m[1],'1');
        window.location.reload();
      } else {
        showUpdateBanner();
      }
    }catch(e){/* sin conexión u otro error: no hacer nada */}
  }
  function showUpdateBanner(){
    if(document.getElementById('sdg-update-banner'))return;
    const b=document.createElement('div');
    b.id='sdg-update-banner';
    b.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:99999;background:#1a7a3c;color:#fff;padding:12px 16px;text-align:center;font-family:Barlow,sans-serif;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 -2px 10px rgba(0,0,0,.2);';
    b.textContent='🔄 Hay una actualización disponible — Tocá para actualizar';
    b.onclick=()=>window.location.reload();
    document.body.appendChild(b);
  }
  window.addEventListener('load',()=>{
    checkForUpdate(true);
    setInterval(()=>checkForUpdate(false),5*60*1000); // re-chequea cada 5 minutos
  });
  // Chequeos extra para celulares: cuando se vuelve a la pestaña (cambiar de app y volver)
  // el navegador a veces restaura la página tal cual estaba, sin recargarla ni disparar
  // 'load' de nuevo, así que sin esto el chequeo podía no correr nunca hasta un cierre total.
  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible')checkForUpdate(true);
  });
  window.addEventListener('pageshow',e=>{
    if(e.persisted)checkForUpdate(true);
  });
})();
